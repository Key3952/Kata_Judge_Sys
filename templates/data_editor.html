{% extends "base.html" %}

{% block title %}Редактор данных{% endblock %}

{% block content %}
<div class="container-fluid mt-4">
    <h2><i class="bi bi-database"></i> Редактор данных</h2>
    
    <!-- Вкладки -->
    <ul class="nav nav-tabs mt-3" id="dataTabs" role="tablist">
        <li class="nav-item" role="presentation">
            <button class="nav-link active" id="participants-tab" data-bs-toggle="tab" data-bs-target="#participants" type="button">Участники</button>
        </li>
        <li class="nav-item" role="presentation">
            <button class="nav-link" id="judges-tab" data-bs-toggle="tab" data-bs-target="#judges" type="button">Судьи</button>
        </li>
        <li class="nav-item" role="presentation">
            <button class="nav-link" id="competitions-tab" data-bs-toggle="tab" data-bs-target="#competitions" type="button">Соревнования</button>
        </li>
    </ul>
    
    <div class="tab-content mt-3" id="dataTabsContent">
        <!-- Участники -->
        <div class="tab-pane fade show active" id="participants" role="tabpanel">
            <div class="row mb-3">
                <div class="col-md-6">
                    <button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#addParticipantModal">
                        <i class="bi bi-plus-lg"></i> Добавить участника
                    </button>
                </div>
                <div class="col-md-6">
                    <input type="text" id="participantSearch" class="form-control" placeholder="Поиск по ФИО или году рождения...">
                </div>
            </div>
            
            <div class="table-responsive">
                <table class="table table-striped table-hover" id="participantsTable">
                    <thead>
                        <tr>
                            <th>ФИО</th>
                            <th>Год рождения</th>
                            <th>Разряд</th>
                            <th>Кю</th>
                            <th>СШ</th>
                            <th>Тренер</th>
                            <th>Действия</th>
                        </tr>
                    </thead>
                    <tbody></tbody>
                </table>
            </div>
        </div>
        
        <!-- Судьи -->
        <div class="tab-pane fade" id="judges" role="tabpanel">
            <div class="row mb-3">
                <div class="col-md-6">
                    <button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#addJudgeModal">
                        <i class="bi bi-plus-lg"></i> Добавить судью
                    </button>
                </div>
                <div class="col-md-6">
                    <input type="text" id="judgeSearch" class="form-control" placeholder="Поиск по ФИО...">
                </div>
            </div>
            
            <div class="table-responsive">
                <table class="table table-striped table-hover" id="judgesTable">
                    <thead>
                        <tr>
                            <th>ФИО</th>
                            <th>Действия</th>
                        </tr>
                    </thead>
                    <tbody></tbody>
                </table>
            </div>
        </div>
        
        <!-- Соревнования -->
        <div class="tab-pane fade" id="competitions" role="tabpanel">
            <div class="table-responsive">
                <table class="table table-striped table-hover" id="competitionsTable">
                    <thead>
                        <tr>
                            <th>Название</th>
                            <th>Папка</th>
                            <th>Дата создания</th>
                            <th>Статус</th>
                            <th>Действия</th>
                        </tr>
                    </thead>
                    <tbody></tbody>
                </table>
            </div>
        </div>
    </div>
</div>

<!-- Модальное окно: Добавить участника -->
<div class="modal fade" id="addParticipantModal" tabindex="-1">
    <div class="modal-dialog modal-lg">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title">Добавить участника</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <form id="addParticipantForm">
                    <div class="row mb-3">
                        <div class="col-md-6">
                            <label class="form-label">ФИО *</label>
                            <input type="text" class="form-control" name="ФИО" required>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">Год рождения *</label>
                            <input type="text" class="form-control" name="год рождения" required>
                        </div>
                    </div>
                    <div class="row mb-3">
                        <div class="col-md-4">
                            <label class="form-label">Разряд</label>
                            <input type="text" class="form-control" name="разряд">
                        </div>
                        <div class="col-md-4">
                            <label class="form-label">Кю</label>
                            <input type="text" class="form-control" name="кю">
                        </div>
                        <div class="col-md-4">
                            <label class="form-label">СШ</label>
                            <input type="text" class="form-control" name="СШ">
                        </div>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Тренер</label>
                        <input type="text" class="form-control" name="тренер">
                    </div>
                </form>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Отмена</button>
                <button type="button" class="btn btn-primary" onclick="saveParticipant()">Сохранить</button>
            </div>
        </div>
    </div>
</div>

<!-- Модальное окно: Редактировать участника -->
<div class="modal fade" id="editParticipantModal" tabindex="-1">
    <div class="modal-dialog modal-lg">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title">Редактировать участника</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <form id="editParticipantForm">
                    <input type="hidden" id="editParticipantId">
                    <div class="row mb-3">
                        <div class="col-md-6">
                            <label class="form-label">ФИО *</label>
                            <input type="text" class="form-control" id="editFio" required>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">Год рождения *</label>
                            <input type="text" class="form-control" id="editBirthYear" required>
                        </div>
                    </div>
                    <div class="row mb-3">
                        <div class="col-md-4">
                            <label class="form-label">Разряд</label>
                            <input type="text" class="form-control" id="editRank">
                        </div>
                        <div class="col-md-4">
                            <label class="form-label">Кю</label>
                            <input type="text" class="form-control" id="editKy">
                        </div>
                        <div class="col-md-4">
                            <label class="form-label">СШ</label>
                            <input type="text" class="form-control" id="editSchool">
                        </div>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Тренер</label>
                        <input type="text" class="form-control" id="editCoach">
                    </div>
                </form>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Отмена</button>
                <button type="button" class="btn btn-primary" onclick="updateParticipant()">Обновить</button>
            </div>
        </div>
    </div>
</div>

<!-- Модальное окно: Добавить судью -->
<div class="modal fade" id="addJudgeModal" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title">Добавить судью</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <form id="addJudgeForm">
                    <div class="mb-3">
                        <label class="form-label">ФИО *</label>
                        <input type="text" class="form-control" name="ФИО" required>
                    </div>
                </form>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Отмена</button>
                <button type="button" class="btn btn-primary" onclick="saveJudge()">Сохранить</button>
            </div>
        </div>
    </div>
</div>

<script>
// Глобальные переменные
let currentParticipants = [];
let currentJudges = [];
let currentCompetitions = [];

// Загрузка данных при инициализации
document.addEventListener('DOMContentLoaded', function() {
    loadParticipants();
    loadJudges();
    loadCompetitions();
    
    // Поиск участников
    document.getElementById('participantSearch').addEventListener('input', function(e) {
        const search = e.target.value.trim();
        filterParticipants(search);
    });
    
    // Поиск судей
    document.getElementById('judgeSearch').addEventListener('input', function(e) {
        const search = e.target.value.trim();
        filterJudges(search);
    });
});

// ==================== УЧАСТНИКИ ====================

function loadParticipants(search = '') {
    fetch(`/api/data/participants${search ? '?search=' + encodeURIComponent(search) : ''}`)
        .then(r => r.json())
        .then(data => {
            currentParticipants = data;
            renderParticipantsTable(data);
        })
        .catch(err => console.error('Ошибка загрузки участников:', err));
}

function renderParticipantsTable(participants) {
    const tbody = document.querySelector('#participantsTable tbody');
    tbody.innerHTML = '';
    
    participants.forEach(p => {
        const tr = document.createElement('tr');
        tr.innerHTML = `
            <td>${escapeHtml(p['ФИО'])}</td>
            <td>${escapeHtml(p['год рождения'])}</td>
            <td>${escapeHtml(p['разряд'] || '')}</td>
            <td>${escapeHtml(p['кю'] || '')}</td>
            <td>${escapeHtml(p['СШ'] || '')}</td>
            <td>${escapeHtml(p['тренер'] || '')}</td>
            <td>
                <button class="btn btn-sm btn-outline-primary" onclick="editParticipant(${p.id})">
                    <i class="bi bi-pencil"></i>
                </button>
                <button class="btn btn-sm btn-outline-danger" onclick="deleteParticipant(${p.id})">
                    <i class="bi bi-trash"></i>
                </button>
            </td>
        `;
        tbody.appendChild(tr);
    });
}

function filterParticipants(search) {
    const filtered = currentParticipants.filter(p => 
        p['ФИО'].toLowerCase().includes(search.toLowerCase()) ||
        p['год рождения'].includes(search)
    );
    renderParticipantsTable(filtered);
}

function saveParticipant() {
    const form = document.getElementById('addParticipantForm');
    const formData = new FormData(form);
    const data = Object.fromEntries(formData.entries());
    
    fetch('/api/data/participants', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify(data)
    })
    .then(r => r.json())
    .then(result => {
        if (result.success) {
            alert('Участник добавлен');
            bootstrap.Modal.getInstance(document.getElementById('addParticipantModal')).hide();
            form.reset();
            loadParticipants();
        } else {
            alert('Ошибка: ' + result.error);
        }
    })
    .catch(err => console.error('Ошибка:', err));
}

function editParticipant(id) {
    const p = currentParticipants.find(x => x.id === id);
    if (!p) return;
    
    document.getElementById('editParticipantId').value = id;
    document.getElementById('editFio').value = p['ФИО'];
    document.getElementById('editBirthYear').value = p['год рождения'];
    document.getElementById('editRank').value = p['разряд'] || '';
    document.getElementById('editKy').value = p['кю'] || '';
    document.getElementById('editSchool').value = p['СШ'] || '';
    document.getElementById('editCoach').value = p['тренер'] || '';
    
    new bootstrap.Modal(document.getElementById('editParticipantModal')).show();
}

function updateParticipant() {
    const id = parseInt(document.getElementById('editParticipantId').value);
    const data = {
        'ФИО': document.getElementById('editFio').value,
        'год рождения': document.getElementById('editBirthYear').value,
        'разряд': document.getElementById('editRank').value,
        'кю': document.getElementById('editKy').value,
        'СШ': document.getElementById('editSchool').value,
        'тренер': document.getElementById('editCoach').value
    };
    
    fetch(`/api/data/participants/${id}`, {
        method: 'PUT',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify(data)
    })
    .then(r => r.json())
    .then(result => {
        if (result.success) {
            alert('Данные обновлены');
            bootstrap.Modal.getInstance(document.getElementById('editParticipantModal')).hide();
            loadParticipants();
        } else {
            alert('Ошибка: ' + result.error);
        }
    })
    .catch(err => console.error('Ошибка:', err));
}

function deleteParticipant(id) {
    if (!confirm('Вы уверены, что хотите удалить этого участника?')) return;
    
    fetch(`/api/data/participants/${id}`, {
        method: 'DELETE'
    })
    .then(r => r.json())
    .then(result => {
        if (result.success) {
            loadParticipants();
        } else {
            alert('Ошибка: ' + result.error);
        }
    })
    .catch(err => console.error('Ошибка:', err));
}

// ==================== СУДЬИ ====================

function loadJudges(search = '') {
    fetch(`/api/data/judges${search ? '?search=' + encodeURIComponent(search) : ''}`)
        .then(r => r.json())
        .then(data => {
            currentJudges = data;
            renderJudgesTable(data);
        })
        .catch(err => console.error('Ошибка загрузки судей:', err));
}

function renderJudgesTable(judges) {
    const tbody = document.querySelector('#judgesTable tbody');
    tbody.innerHTML = '';
    
    judges.forEach(j => {
        const tr = document.createElement('tr');
        tr.innerHTML = `
            <td>${escapeHtml(j['ФИО'])}</td>
            <td>
                <button class="btn btn-sm btn-outline-danger" onclick="deleteJudge(${j.id})">
                    <i class="bi bi-trash"></i>
                </button>
            </td>
        `;
        tbody.appendChild(tr);
    });
}

function filterJudges(search) {
    const filtered = currentJudges.filter(j => 
        j['ФИО'].toLowerCase().includes(search.toLowerCase())
    );
    renderJudgesTable(filtered);
}

function saveJudge() {
    const form = document.getElementById('addJudgeForm');
    const formData = new FormData(form);
    const data = Object.fromEntries(formData.entries());
    
    fetch('/api/data/judges', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify(data)
    })
    .then(r => r.json())
    .then(result => {
        if (result.success) {
            alert('Судья добавлен');
            bootstrap.Modal.getInstance(document.getElementById('addJudgeModal')).hide();
            form.reset();
            loadJudges();
        } else {
            alert('Ошибка: ' + result.error);
        }
    })
    .catch(err => console.error('Ошибка:', err));
}

function deleteJudge(id) {
    if (!confirm('Вы уверены, что хотите удалить этого судью?')) return;
    
    fetch(`/api/data/judges/${id}`, {
        method: 'DELETE'
    })
    .then(r => r.json())
    .then(result => {
        if (result.success) {
            loadJudges();
        } else {
            alert('Ошибка: ' + result.error);
        }
    })
    .catch(err => console.error('Ошибка:', err));
}

// ==================== СОРЕВНОВАНИЯ ====================

function loadCompetitions() {
    fetch('/api/data/competitions')
        .then(r => r.json())
        .then(data => {
            currentCompetitions = data;
            renderCompetitionsTable(data);
        })
        .catch(err => console.error('Ошибка загрузки соревнований:', err));
}

function renderCompetitionsTable(competitions) {
    const tbody = document.querySelector('#competitionsTable tbody');
    tbody.innerHTML = '';
    
    competitions.forEach(c => {
        const statusBadge = c.status === 'open' 
            ? '<span class="badge bg-success">Открыто</span>' 
            : '<span class="badge bg-secondary">Закрыто</span>';
        
        const tr = document.createElement('tr');
        tr.innerHTML = `
            <td>${escapeHtml(c.name)}</td>
            <td><code>${escapeHtml(c.folder_name)}</code></td>
            <td>${c.created_at ? new Date(c.created_at).toLocaleDateString('ru-RU') : ''}</td>
            <td>${statusBadge}</td>
            <td>
                <a href="/admin/${escapeHtml(c.folder_name)}" class="btn btn-sm btn-outline-primary">
                    <i class="bi bi-pencil"></i> Редактировать
                </a>
            </td>
        `;
        tbody.appendChild(tr);
    });
}

// Утилита
function escapeHtml(text) {
    if (!text) return '';
    const div = document.createElement('div');
    div.textContent = text;
    return div.innerHTML;
}
</script>
{% endblock %}
